<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend-tmp</title>
    <script>
      // mesma regra de src/state/theme.ts, antes do primeiro paint: sem isto o tema escuro
      // abre com um piscar claro enquanto o React carrega
      const tema = localStorage.getItem('gf:theme')
      const escuro = matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.classList.toggle(
        'dark',
        tema === 'dark' || (tema !== 'light' && escuro),
      )
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
