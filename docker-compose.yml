services:
  db:
    image: postgres:16-alpine
    container_name: gf_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gf_senha_local}
      POSTGRES_DB: ${POSTGRES_DB:-gestao}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gf} -d ${POSTGRES_DB:-gestao}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: gf_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gf}:${POSTGRES_PASSWORD:-gf_senha_local}@db:5432/${POSTGRES_DB:-gestao}
      SEGREDO_JWT: ${SEGREDO_JWT:-troque_este_segredo_em_producao}
      ORIGENS_PERMITIDAS: ${ORIGENS_PERMITIDAS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app

volumes:
  dados_postgres:
